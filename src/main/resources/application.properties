# Server
server.port=${SERVER_PORT:8080}

# Không bật staging profile mặc định.
# Chỉ bật khi chạy local test bằng SPRING_PROFILES_ACTIVE.

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moldy_market}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AWS SQS (thêm fallback default)
aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL:http://localhost:9324/queue/local-notifications}

# AWS DynamoDB
aws.dynamodb.notifications-table=${AWS_DYNAMODB_NOTIFICATIONS_TABLE:notifications}

# AWS Region
aws.region=${AWS_REGION:ap-south-1}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true

# Security JWT
security.jwt.secret=${JWT_SECRET:c3VwZXJfc2VjcmV0X2tleV9mb3JfbW9sZHlfbWFya2V0X2FwaV9zZWN1cml0eV8yNTZiaXRzIQ==}
security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=2592000000
# Admin Seed Account
admin.email=${ADMIN_EMAIL:admin@moldymarket.com}
admin.password=${ADMIN_PASSWORD:Admin@123456}
admin.full-name=${ADMIN_FULL_NAME:System Administrator}
