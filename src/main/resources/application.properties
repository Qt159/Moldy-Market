# APPLICATION
spring.application.name=moldy-market
server.port=${SERVER_PORT:8080}

# DATABASE - AWS RDS POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AWS GENERAL
aws.region=${AWS_REGION:ap-south-1}

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL}

aws.sns.notification-topic-arn=${AWS_SNS_NOTIFICATION_TOPIC_ARN:}

aws.dynamodb.notifications-table=${AWS_DYNAMODB_NOTIFICATIONS_TABLE}

# SECURITY - JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=900000
security.jwt.refresh-token-expiration=2592000000


# ADMIN SEED ACCOUNT
admin.email=${ADMIN_EMAIL:admin@moldymarket.com}
admin.password=${ADMIN_PASSWORD}
admin.full-name=${ADMIN_FULL_NAME:System Administrator}


# BREVO - TRANSACTIONAL EMAIL

brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}
brevo.sender-name=${BREVO_SENDER_NAME:Moldy Market}

# SEPAY - PAYMENT GATEWAY
sepay.environment=${SEPAY_ENV:sandbox}
sepay.merchant-id=${SEPAY_MERCHANT_ID}
sepay.secret-key=${SEPAY_SECRET_KEY}
sePay.bank.account=${SEPAY_BANK_ACCOUNT}
sePay.bank.name=${SEPAY_BANK_NAME}

# MAIL TIMEOUT
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SPRINGDOC - SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
