# Server
server.port=${SERVER_PORT:8080}

# Không bật staging profile mặc định.
# Chỉ bật khi chạy local test bằng SPRING_PROFILES_ACTIVE.

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moldy_market}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AWS SQS
aws.sqs.notification-queue-url=${AWS_SQS_NOTIFICATION_QUEUE_URL}

# AWS DynamoDB
aws.dynamodb.notifications-table=${AWS_DYNAMODB_NOTIFICATIONS_TABLE:notifications}

# AWS Region
aws.region=${AWS_REGION:ap-south-1}