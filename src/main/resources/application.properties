# ── Server ────────────────────────────────────────────────────────────
server.port=8080

# Profile: staging-notification — bật security bypass cho test notification module
# Xóa dòng này khi auth module hoàn thiện
spring.profiles.active=staging-notification

# ── Database ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/moldy_market
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── AWS SQS ───────────────────────────────────────────────────────────
# Queue URL lấy từ AWS console sau khi tạo SQS queue
aws.sqs.notification-queue-url=https://sqs.ap-southeast-1.amazonaws.com/{account-id}/moldy-market-notifications

# ── AWS DynamoDB ──────────────────────────────────────────────────────
aws.dynamodb.notifications-table=notifications

# ── AWS Region ────────────────────────────────────────────────────────
aws.region=ap-southeast-1
