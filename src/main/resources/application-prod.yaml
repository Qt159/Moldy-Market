spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${DB_SSL_ROOT_CERT}
  jpa:
    # Keep schema changes operator-controlled until the RDS schema is inventoried.
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    store: ${APP_RATE_LIMIT_STORE:redis}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

security:
  jwt:
    secret: ${JWT_SECRET}

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  full-name: ${ADMIN_FULL_NAME:System Administrator}

aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}
  sqs:
    notification-queue-url: ${AWS_SQS_NOTIFICATION_QUEUE_URL:}
  dynamodb:
    notifications-table: ${AWS_DYNAMODB_NOTIFICATIONS_TABLE}
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME:Moldy Market}

sePay:
  bank:
    account: ${SEPAY_BANK_ACCOUNT}
    name: ${SEPAY_BANK_NAME}
  webhook:
    secret-key: ${SEPAY_WEBHOOK_SECRET_KEY}

notifications:
  outbox:
    enabled: ${NOTIFICATIONS_OUTBOX_ENABLED:false}
