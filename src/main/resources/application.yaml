spring:
  application:
    name: moldy-market
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    region: ${AWS_REGION:ap-south-1}
    upload-expiration-minutes: 5
    download-expiration-minutes: 5

features:
  disputes:
    enabled: ${FEATURES_DISPUTES_ENABLED:true}

storage:
  cleanup:
    enabled: false

wallet:
  withdrawal:
    auto-approval:
      enabled: false

outbox:
  publisher:
    batch-size: 20
    max-retries: 12
    initial-retry-delay: 5s
    max-retry-delay: 1h
    claim-lease: 2m
    interval: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
