spring:
  application:
    name: moldy-market
  profiles:
    active: local

server:
  port: 8080

aws:
  sqs:
    notification-queue-url: ${AWS_SQS_NOTIFICATION_QUEUE_URL:http://localhost:9324/queue/local-notifications}
   s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-southeast-1}
    upload-expiration-minutes: 5
    download-expiration-minutes: 5