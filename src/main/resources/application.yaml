spring:
  application:
    name: moldy-market

  profiles:
    active: local

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@moldymarket.local}

aws:
  sqs:
    notification-queue-url: ${AWS_SQS_NOTIFICATION_QUEUE_URL:http://localhost:9324/queue/local-notifications}
  s3:
    bucket: ${AWS_S3_BUCKET:moldy-market-local}
    region: ${AWS_REGION:ap-southeast-1}
    upload-expiration-minutes: 5
    download-expiration-minutes: 5
