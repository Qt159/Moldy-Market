spring:
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:moldy_market}}"
    username: ${DB_USERNAME:${POSTGRES_USER:moldy_user}}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    store: ${APP_RATE_LIMIT_STORE:memory}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

security:
  jwt:
    secret: ${JWT_SECRET}

admin:
  email: ${ADMIN_EMAIL:admin@moldymarket.local}
  password: ${ADMIN_PASSWORD}
  full-name: ${ADMIN_FULL_NAME:Local Administrator}

aws:
  region: ${AWS_REGION:ap-south-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:moldy-market-local}
    region: ${AWS_REGION:ap-south-1}
  sqs:
    notification-queue-url: ${AWS_SQS_NOTIFICATION_QUEUE_URL:}
  dynamodb:
    notifications-table: ${AWS_DYNAMODB_NOTIFICATIONS_TABLE:notifications}
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:no-reply@moldymarket.local}
  sender-name: ${BREVO_SENDER_NAME:Moldy Market}

sePay:
  bank:
    account: ${SEPAY_BANK_ACCOUNT:0000000000}
    name: ${SEPAY_BANK_NAME:LOCAL}
  webhook:
    secret-key: ${SEPAY_WEBHOOK_SECRET_KEY:}

notifications:
  outbox:
    enabled: false

