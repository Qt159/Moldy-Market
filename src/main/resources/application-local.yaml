spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  data:
    redis:
      password: ${REDIS_PASSWORD:}

app:
  rate-limit:
    store: redis

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000   # 30 days in milliseconds

wallet:
  withdrawal:
    auto-approval:
      enabled: true
      max-amount: 5000000 #must withdraw smaller than this number
      max-daily-total: 20000000 #threshold for total withdrawal amount within 24h
sePay:
  bank:
    account: ${BANK_ACCOUNT}
    name: ${BANK_NAME}
  webhook:
    secret-key: ${SEPAY_SECRET}
admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  full-name: ${ADMIN_FULL_NAME}

