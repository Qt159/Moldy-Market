services:
  postgres:
    image: postgres:16
    container_name: moldy-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moldy_market}
      POSTGRES_USER: ${POSTGRES_USER:-moldy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - moldy_market_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moldy_user} -d ${POSTGRES_DB:-moldy_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  mailpit:
    image: axllent/mailpit:latest
    container_name: moldy-market-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # giao diện xem mail: http://localhost:8025


volumes:
  moldy_market_postgres_data: